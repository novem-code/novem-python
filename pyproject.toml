[project]
name = "novem"
version = "0.6.2"
description = "python library for the novem data visualisation platform"
authors = [
    { name = "Sondov Engen", email = "sen@novem.io" },
    { name = "Bjørnar Snoksrud", email = "bsn@novem.io" },
    { name = "Martin Myrseth", email = "mmy@novem.io" },
]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "requests>=2.32.4",
    "pyreadline3>=3.5.4 ; os_name == 'nt'",
    "colorama>=0.4.6",
    "urllib3>=2.5.0",
    "typing-extensions>=4.14.1",
]

[project.optional-dependencies]
events = [
    "python-socketio[asyncio_client]>=5.11.0",
]
compute = [
    # live computer connections (novem.compute.v1 over /ws-cu) need a
    # WebSocket client that can set headers and negotiate a subprotocol
    "aiohttp>=3.9",
]
mcp = [
    # novem.comments.MCP() targets the v1 API (mcp.server.fastmcp.FastMCP,
    # Tool.inputSchema).  mcp 2.0 removed both, so keep the extra on 1.x
    # until the migration lands -- see the tracking issue.
    "mcp>=1.0.0,<2",
]

[project.urls]
Homepage = "https://novem.io"
Repository = "https://github.com/novem-code/novem-python"

[project.scripts]
novem = "novem.cli:run_cli"

[dependency-groups]
dev = [
    "aiohttp>=3.9",
    "mypy>=1.11.2",
    "pydantic>=2.8.2",
    "pyfakefs==6.2.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "requests-mock>=1.12.1",
    "types-requests>=2.27.7",
    "pandas>=2.2.2",
    "pandas-stubs>=2.2.2.240807",
    "ruff>=0.14",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/tests",
  "/scripts",
  "/examples",
  "/.mailmap",
  "/.git-blame-ignore-revs",
  "/flake.nix",
  "/flake.lock",
  "/uv.lock",
  "/Makefile",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# README/docs code fences are display copy sized for a narrow column (PyPI),
# not source -- don't let the formatter widen them to line-length.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (the old flake8 regime), I import sorting (old isort)
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::UserWarning",
]
