name: CLI Publish

# Repackages the native novem binaries from a novem-code/cli release as
# novem-cli platform wheels on PyPI, which is what `novem[cli]` installs,
# then opens a PR moving the novem[cli] pin to the new version.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "novem-code/cli release tag, e.g. v0.2.2"
        required: true
  repository_dispatch:
    types: [cli-release]

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.client_payload.tag }}

jobs:
  build:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Download release binaries
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Expected a release tag like v1.2.3, got: $TAG" >&2
          exit 1
        fi
        gh release download "$TAG" -R novem-code/cli -D release
        cd release && sha256sum -c SHA256SUMS

    - name: Build wheels
      run: |
        export NOVEM_CLI_VERSION="${TAG#v}"
        for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc; do
          # absolute, the build backend runs inside novem-cli/
          binary="$GITHUB_WORKSPACE/release/novem-$target"
          [[ "$target" == *windows* ]] && binary="$binary.exe"
          NOVEM_CLI_TARGET="$target" NOVEM_CLI_BINARY="$binary" uv build --wheel -o dist novem-cli
        done
        ls -l dist

    - name: Smoke test
      run: |
        uv venv /tmp/smoke
        VIRTUAL_ENV=/tmp/smoke uv pip install --no-index --find-links dist novem-cli
        "$(/tmp/smoke/bin/python -c 'import novem_cli; print(novem_cli.find_binary())')" --version

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cli-wheels
        path: dist/
        retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: release
      url: https://pypi.org/p/novem-cli
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: cli-wheels
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  bump:
    name: Open pin bump PR
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    needs: publish
    steps:
    # The gha-releases app, as in python-publish.yml and update-flake-lock.yml:
    # it may push branches past the branch ruleset, and its PRs trigger CI
    # where GITHUB_TOKEN's don't.
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ vars.GHA_RELEASES_CLIENT_ID }}
        private-key: ${{ secrets.GHA_RELEASES_PRIVATE_KEY }}
        repositories: novem-python
        permission-contents: write
        permission-pull-requests: write

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        token: ${{ steps.app-token.outputs.token }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Bump novem-cli pin
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        VERSION="${TAG#v}"
        if ! grep -q '"novem-cli==' pyproject.toml; then
          echo "No novem-cli pin in pyproject.toml to bump" >&2
          exit 1
        fi
        sed -i -E "s/\"novem-cli==[^ ;\"]+/\"novem-cli==$VERSION/" pyproject.toml
        if git diff --quiet; then
          echo "novem[cli] already pins novem-cli $VERSION"
          exit 0
        fi

        # a fresh upload can take a little while to appear in the index
        for attempt in 1 2 3 4 5 6; do
          uv lock --upgrade-package novem-cli --refresh-package novem-cli && break
          [[ $attempt == 6 ]] && exit 1
          sleep 30
        done

        BRANCH="cli-bump/$TAG"
        git config user.name "gha-releases[bot]"
        git config user.email "248684608+gha-releases[bot]@users.noreply.github.com"
        git switch -c "$BRANCH"
        git commit -am "build(deps): bump novem-cli to $VERSION"
        git push origin "$BRANCH"
        gh pr create --base main --head "$BRANCH" \
          --title "build(deps): bump novem-cli to $VERSION" \
          --body "Moves the \`novem[cli]\` pin to the native CLI from https://github.com/novem-code/cli/releases/tag/$TAG. Merge and cut a novem release to ship it, so \`pipx upgrade novem\` picks it up."
